<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get 6 Free Drinks Every Month! — Hanoi Drip Coffee Membership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --muted:#6b6f76;
    --line:#e7e5e0;
    --chip:#f2f1ee;
    --accent:#8a6b3f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:var(--ink);
    height:8px;
  }

  /* ---------- NAV ---------- */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 40px;
    max-width:1180px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:700;
    font-size:16px;
  }
  .brand-mark{
    width:34px;height:34px;
    border-radius:8px;
    background:var(--ink);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .btn{
    display:inline-block;
    font-weight:700;
    font-size:14px;
    padding:11px 22px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:#000;}

  /* ---------- HERO ---------- */
  .hero{
    padding:64px 0 88px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:64px;
    align-items:center;
  }
  .rating-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--chip);
    border-radius:999px;
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    color:#3d3d3d;
    margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(36px,4.4vw,52px);
    line-height:1.08;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }
  .hero p.lede{
    margin-top:20px;
    font-size:16px;
    line-height:1.65;
    color:var(--muted);
    max-width:460px;
  }
  .hero .btn{
    margin-top:30px;
    padding:16px 28px;
    font-size:15px;
  }

  /* ---------- HERO MEDIA CARD ---------- */
  .media-card{
    border-radius:18px;
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.08);
  }
  .media-photo{
    height:360px;
    background:linear-gradient(135deg,#caa46b 0%,#8a6b3f 45%,#4f7a52 100%);
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:18px;
