<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Card - Hanoi Drip</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f7f7f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Container */
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #eaeaea;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    /* Image Box */
    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 0.85;
      overflow: hidden;
      background-color: #f2f2f2;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Navigation / Progress Track (Image 1 Style) */
    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 12px;
    }

    .nav-arrow {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid #e0e0e0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #666;
      transition: all 0.2s ease;
    }

    .nav-arrow:hover {
      background-color: #f5f5f5;
      color: #111;
    }

    .nav-arrow svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    .progress-bar-track {
      flex: 1;
      height: 4px;
      background-color: #ececec;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 35%; /* Adjust active position */
      background-color: #bcbcbc;
      border-radius: 999px;
    }

    /* Footer Pricing / Offer Details */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px 16px;
      border-top: 1px solid #f0f0f0;
    }

    .offer-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .tag-icon {
      font-size: 14px;
      line-height: 1;
    }

    .price-text {
      font-size: 14px;
      font-weight: 700;
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="image-container">
      <img src="hanoi-drip-drinks.jpg" alt="Hanoi Drip Vietnamese Coffee & Matcha">
    </div>

    <div class="carousel-controls">
      <button class="nav-arrow" aria-label="Previous">
        <svg viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="progress-bar-track">
        <div class="progress-bar-fill"></div>
      </div>

      <button class="nav-arrow" aria-label="Next">
        <svg viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
    
    <div class="card-footer">
      <div class="offer-badge">
        <span class="tag-icon">🏷️</span>
        <span>Try 30 days for $12.50</span>
      </div>
      <span class="price-text">$25/month</span>
    </div>
  </div>

</body>
</html>
