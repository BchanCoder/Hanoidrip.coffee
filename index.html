<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get 6 Free Drinks Every Month! — Amaro Coffee Co. Membership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --muted:#6b6f76;
    --line:#e7e5e0;
    --chip:#f2f1ee;
    --accent:#8a6b3f;   /* warm coffee brown, used sparingly */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:var(--ink);
    height:8px;
  }

  /* ---------- NAV ---------- */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 40px;
    max-width:1180px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:700;
    font-size:16px;
  }
  .brand-mark{
    width:34px;height:34px;
    border-radius:8px;
    background:var(--ink);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .btn{
    display:inline-block;
    font-weight:700;
    font-size:14px;
    padding:11px 22px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:#000;}

  /* ---------- HERO ---------- */
  .hero{
    padding:64px 0 88px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:64px;
    align-items:center;
  }
  .rating-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--chip);
    border-radius:999px;
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    color:#3d3d3d;
    margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(36px,4.4vw,52px);
    line-height:1.08;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }
  .hero p.lede{
    margin-top:20px;
    font-size:16px;
    line-height:1.65;
    color:var(--muted);
    max-width:460px;
  }
  .hero .btn{
    margin-top:30px;
    padding:16px 28px;
    font-size:15px;
  }

  /* ---------- HERO MEDIA CARD ---------- */
  .media-card{
    border-radius:18px;
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.08);
  }
  .media-photo{
    height:360px;
    background:linear-gradient(135deg,#caa46b 0%,#8a6b3f 45%,#4f7a52 100%);
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:18px;
    padding-bottom:36px;
  }
  .cup{
    width:70px;
    height:130px;
    background:rgba(255,255,255,0.92);
    border-radius:8px 8px 22px 22px;
    position:relative;
    box-shadow:0 10px 24px rgba(0,0,0,0.25);
  }
  .cup::before{
    content:"YOUR LOGO";
    position:absolute;
    top:44%;
    left:50%;
    transform:translate(-50%,-50%) rotate(0deg);
    font-size:8px;
    font-weight:800;
    letter-spacing:0.06em;
    color:#4f7a52;
    text-align:center;
    width:56px;
  }
  .cup.dark{background:rgba(60,40,20,0.85);}
  .cup.dark::before{color:#e9dcc4;}
  .media-controls{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 18px;
  }
  .arrow{
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    color:var(--muted);
    flex-shrink:0;
  }
  .dots-track{
    flex:1;
    height:4px;
    background:var(--chip);
    border-radius:999px;
    position:relative;
  }
  .dots-track::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:35%;
    background:#c7c4bd;
    border-radius:999px;
  }
  .media-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-top:1px solid var(--line);
    background:#fafaf9;
    font-size:13px;
  }
  .media-foot .promo{
    display:flex;
    align-items:center;
    gap:8px;
    color:#3d3d3d;
    font-weight:500;
  }
  .media-foot .price{
    font-weight:700;
  }

  /* ---------- MEMBERSHIP INCLUDES ---------- */
  .section{
    padding:70px 0 90px;
  }
  .section h2{
    text-align:center;
    font-size:clamp(28px,3.2vw,36px);
    font-weight:800;
    margin:0 0 40px;
  }
  .perks{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
  }
  .perk{
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:#fff;
    cursor:pointer;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .perk:hover{
    box-shadow:0 14px 30px rgba(0,0,0,0.08);
    transform:translateY(-2px);
  }
  .perk-photo{
    height:150px;
    background:linear-gradient(135deg,var(--p1,#caa46b),var(--p2,#4f7a52));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
  }
  .perk-body{padding:16px 18px 20px;}
  .perk h3{
    font-size:15px;
    font-weight:700;
    margin:0 0 8px;
  }
  .perk p{
    font-size:13px;
    line-height:1.55;
    color:var(--muted);
    margin:0 0 12px;
    min-height:56px;
  }
  .included-tag{
    display:inline-block;
    background:var(--chip);
    color:#3d3d3d;
    font-size:11px;
    font-weight:700;
    padding:5px 10px;
    border-radius:6px;
  }

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;}
    .perks{grid-template-columns:repeat(2,1fr);}
    .nav, .wrap{padding-left:20px;padding-right:20px;}
  }
  @media (max-width:520px){
    .perks{grid-template-columns:1fr;}
  }

  /* ---------- REDEEM MODAL ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,20,20,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg,#34c777 0%,#1fa860 100%);
    border-radius:28px;
    padding:28px 26px 24px;
    position:relative;
    color:#fff;
    box-shadow:0 30px 70px rgba(0,0,0,0.35);
    animation:pop-in .22s ease;
  }
  @keyframes pop-in{
    from{opacity:0; transform:translateY(14px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .modal-handle{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:18px;
  }
  .modal-handle span{
    width:26px;height:4px;
    border-radius:999px;
    background:rgba(255,255,255,0.55);
  }
  .modal-close-x{
    position:absolute;
    top:22px;
    right:22px;
    width:26px;height:26px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-check{
    width:88px;height:88px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:6px auto 22px;
  }
  .modal-check svg{width:44px;height:44px;}
  .modal-title{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin:0 0 10px;
  }
  .modal-sub{
    text-align:center;
    font-size:15px;
    color:rgba(255,255,255,0.85);
    margin:0 0 24px;
  }
  .modal-reward-card{
    background:#fff;
    color:var(--ink);
    border-radius:16px;
    padding:20px 20px 18px;
  }
  .modal-reward-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .modal-reward-label{
    font-size:11px;
    font-weight:800;
    letter-spacing:0.06em;
    color:#1fa860;
  }
  .modal-reward-title{
    font-size:20px;
    font-weight:800;
    margin:0 0 8px;
  }
  .modal-reward-desc{
    font-size:14px;
    color:var(--muted);
    line-height:1.55;
    margin:0;
  }
  .modal-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:16px 0 14px;
  }
  .modal-timestamp{
    font-size:13px;
    color:#8a8f98;
  }
  .modal-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
  }
  .modal-member{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .modal-avatar{
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
  }
  .modal-member-name{font-weight:700;font-size:15px;}
  .modal-member-id{font-size:12px;color:rgba(255,255,255,0.7);}
  .modal-close-btn{
    background:none;
    border:none;
    color:#fff;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>
